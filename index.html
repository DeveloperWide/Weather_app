<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Weather App</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="weather_card">
      <div class="black_layer">
        <div class="get_weather">
          <input
            type="text"
            class="city_input"
            placeholder="Enter Your Location"
          />
          <button class="get_weather_btn">Search</button>
        </div>
        <div class="weather_info">
          <div class="weather_img">
            <img
              src="https://uxwing.com/wp-content/themes/uxwing/download/weather/weather-icon.png"
              alt="Img Weather"
            />
          </div>
          <p class="temperature">25°C</p>
          <p class="location">delhi, india</p>
        </div>
      </div>
    </div>
    <script src="./dist/script.js" type="module"></script>
  </body>
</html>
